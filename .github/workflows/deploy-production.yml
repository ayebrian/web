name: Production deploy

on:
  push:
    branches: [ "production" ]
  workflow_dispatch:

jobs:
  production-deploy:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Set up Docker buildx
      uses: docker/setup-buildx-action@v2
    - name: Build and export image
      uses: docker/build-push-action@v4
      with:
        context: .
        tags: friendly-web:latest
        outputs: type=docker,dest=/tmp/friendly-web.tar
    - name: Copy image to server
      uses: appleboy/scp-action@master
      with:
        host: ${{ secrets.REMOTE_HOST }}
        username: ${{ secrets.REMOTE_USER }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        source: "/tmp/friendly-web.tar"
        target: "${{ secrets.REMOTE_TARGET }}"
        strip_components: 1
    - name: Copy Docker Compose config to server
      uses: appleboy/scp-action@master
      with:
        host: ${{ secrets.REMOTE_HOST }}
        username: ${{ secrets.REMOTE_USER }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        source: "compose.yml"
        target: "${{ secrets.REMOTE_TARGET }}"
        strip_components: 0
    - name: Deploy with Docker Compose
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.REMOTE_HOST }}
        username: ${{ secrets.REMOTE_USER }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        script: |
            docker load -i ${{ secrets.REMOTE_TARGET }}/friendly-web.tar
            cd ${{ secrets.REMOTE_TARGET }}
            docker compose up -d --force-recreate friendly-web
            rm ${{ secrets.REMOTE_TARGET }}/friendly-web.tar
            docker image prune -f
